[package]
name = "eoti"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Structural type inference and pre-run type checker for EO, over XMIR"
authors = ["Max Trunnikov <mtrunnikov@zerocracy.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/maxonfjvipon/eoti"
homepage = "https://github.com/maxonfjvipon/eoti"
keywords = ["eolang", "xmir", "type-inference", "type-checker", "mlsub"]
categories = ["development-tools", "compilers"]
exclude = ["/docs/*.pdf", "/.oracle", "/.github"]

[lib]
name = "eoti"
path = "src/lib.rs"

[[bin]]
name = "eoti"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dev-dependencies]
serde_json = "1.0.151"
